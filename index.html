<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日语文章打字练习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea;--card:#fffdf8;--ink:#2a2521;--muted:#857b70;--line:#e5ddd0;
  --ok:#2c7a57;--bad:#c2410c;--bad-bg:#fde4d6;--accent:#b4462f;--accent-ink:#fff;
  --pending:#b3a99d;--cursor:#b4462f;--soft:#efe8dc;--hint:#f3ece0;
  --kb-hl:#2f8fe0;--f1:#f6dfe4;--f2:#e3e4f6;--f3:#dcecf6;--f4:#e1f2e6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1815;--card:#23201c;--ink:#efe9df;--muted:#9b9187;--line:#38322b;
  --ok:#6cc59a;--bad:#ff8f63;--bad-bg:#4b2516;--accent:#e07a60;--accent-ink:#1a1815;
  --pending:#6a6259;--cursor:#e07a60;--soft:#2c2823;--hint:#2a2622;
  --kb-hl:#3d9be9;--f1:#3d2a2e;--f2:#2d2e3f;--f3:#26333d;--f4:#28382d;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:28px 16px 56px}
header h1{font-size:22px;margin:0 0 2px;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.hidden{display:none!important}
textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent)}
#src{min-height:230px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.row.space{justify-content:space-between}
button,.filebtn{font:inherit;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:hover,.filebtn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:9px 10px}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
.filebtn input{display:none}
.opts{display:flex;flex-wrap:wrap;gap:14px 20px;margin-top:14px;font-size:14px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts.ime{padding-top:14px;border-top:1px dashed var(--line)}
select{font:inherit;font-size:14px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* practice */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--soft);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.target{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;font-size:26px;line-height:1.9;margin:22px 2px 6px;word-break:break-all;min-height:50px}
.target.ruby{line-height:2.3}
.target rt{font-family:"Zen Kaku Gothic New",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.02em}
.target span{transition:color .08s}
.target .p{color:var(--pending)}
.target .o{color:var(--ok)}
.target .x{color:var(--bad);background:var(--bad-bg);border-radius:3px}
.target .c{color:var(--ink);box-shadow:inset 0 -2px 0 var(--cursor)}
.target .w{color:var(--muted)}
.next{font-size:14px;color:var(--pending);min-height:22px;margin:0 2px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next::before{content:"下一句　";color:var(--muted)}
#inp{font-size:20px;min-height:64px;resize:none;line-height:1.6}
.msg{font-size:13px;min-height:20px;margin-top:6px;color:var(--muted)}
.msg.bad{color:var(--bad)}
.flash{animation:flash .35s}
@keyframes flash{0%{background:var(--soft)}100%{background:transparent}}

/* hint box */
.hint{background:var(--hint);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.hint .head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hint .word{font-size:17px;font-weight:700}
.hint .read{color:var(--muted)}
.hint .conv{font-size:13px;color:var(--accent)}
.hint .units{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hint .u{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:4px 8px 5px;border-radius:9px;background:var(--card);border:1px solid var(--line);line-height:1.3}
.hint .u i{font-style:normal;font-size:13px;color:var(--muted)}
.hint .u b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;font-weight:600;white-space:nowrap}
.hint .u b u{text-decoration:none;color:var(--ok)}
.hint .u.done{opacity:.35}
.hint .u.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint .after{margin-top:8px;font-size:13px;color:var(--muted)}
.hint .after b{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;color:var(--ink)}
.hint .legend{margin-top:6px;font-size:12px;color:var(--muted)}
.hint .nk{margin-top:10px;font-size:15px}
.hint .nk kbd{display:inline-block;min-width:24px;text-align:center;padding:1px 7px;border-radius:6px;background:var(--kb-hl);color:#fff;font-family:inherit;font-weight:700;font-size:14px}
.hint .nk .fn{margin-left:8px;font-size:12px;color:var(--muted)}
/* physical keyboard */
.kb{display:flex;flex-direction:column;gap:4px;margin-top:8px;user-select:none}
.kr{display:flex;gap:4px}
.k{flex:var(--w,1) 1 0;min-width:0;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--card);position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink);transition:background .1s,transform .1s}
.k em{font-style:normal;font-weight:600}
.k s{position:absolute;top:1px;left:4px;font-size:9px;color:var(--muted);text-decoration:none}
.k sub{position:absolute;bottom:1px;right:4px;font-size:10px;color:var(--muted)}
.k.blank{visibility:hidden}
.f-lp,.f-rp{background:var(--f1)} .f-lr,.f-rr{background:var(--f2)} .f-lm,.f-rm{background:var(--f3)} .f-li,.f-ri{background:var(--f4)}
.k.hl{background:var(--kb-hl)!important;border-color:var(--kb-hl);color:#fff;transform:translateY(-1px);box-shadow:0 3px 8px rgba(47,143,224,.35)}
.k.hl s,.k.hl sub{color:#e6f2ff}
/* flick pad */
.fp{display:grid;grid-template-columns:.8fr 1fr 1fr 1fr .8fr;gap:5px;margin-top:8px;max-width:360px;user-select:none}
.fk{height:54px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.fk.side{font-size:12px;font-weight:500;color:var(--muted);background:var(--soft)}
.fk.blank{visibility:hidden}
.fk.hl{background:var(--kb-hl);border-color:var(--kb-hl);color:#fff}
.fk.cross{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:2px;font-size:11px;font-weight:500;height:54px;line-height:1}
.fk.cross span{display:flex;align-items:center;justify-content:center;opacity:.75}
.fk.cross span.tg{background:#fff;color:var(--kb-hl);border-radius:4px;font-weight:800;font-size:13px;opacity:1}
@media (max-width:520px){
  .kb{gap:3px}.kr{gap:3px}
  .k{height:30px;font-size:11px;border-radius:5px}
  .k s{font-size:8px;left:2px}.k sub{font-size:8px;right:2px}
}

/* result */
.big{font-size:42px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.res .stat b{font-size:24px}
@media (max-width:520px){
  .wrap{padding:18px 12px 40px}
  .target{font-size:22px}
  .stat b{font-size:17px}
  .stats{gap:6px}
  .hint .u{min-width:34px;padding:3px 6px 4px}
  .hint .u b{font-size:15px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>日语文章打字练习</h1>
    <p>贴入任何日语文章，用你自己的输入法逐句打出来。电脑罗马字、手机 flick 都可以。</p>
  </header>

  <!-- setup -->
  <section id="setup" class="card">
    <textarea id="src" placeholder="在这里粘贴日语文章（新闻、小说、歌词、自己的笔记都可以）…"></textarea>
    <div class="row space">
      <div class="row" style="margin:0">
        <label class="filebtn">上传 .txt 文件<input id="file" type="file" accept=".txt,text/plain"></label>
        <button class="ghost" id="sample">放一段示例</button>
        <button class="ghost" id="clear">清空</button>
      </div>
      <span class="note" id="count" style="margin:0"></span>
    </div>
    <div class="opts">
      <label>分句方式
        <select id="mode">
          <option value="sentence">按句子（。！？）</option>
          <option value="line">按行 / 段落</option>
        </select>
      </label>
      <label><input type="checkbox" id="nopunct"> 不用打标点</label>
      <label><input type="checkbox" id="nospace" checked> 忽略空格</label>
      <label>每句重复
        <select id="reps">
          <option value="1">1 遍</option>
          <option value="2">2 遍</option>
          <option value="3">3 遍</option>
          <option value="5">5 遍</option>
        </select>
      </label>
    </div>
    <div class="opts ime">
      <label>我的输入法
        <select id="ime">
          <option value="romaji">罗马字输入（电脑 / 手机全键盘）</option>
          <option value="flick">手机 flick（12 键假名）</option>
          <option value="kana">电脑假名输入（JIS かな配列）</option>
        </select>
      </label>
      <label id="kbdWrap">键盘布局
        <select id="kbd">
          <option value="us">美式（US）</option>
          <option value="jis">日式（JIS）</option>
        </select>
      </label>
      <label><input type="checkbox" id="hint"> 显示按键提示和读音</label>
    </div>
    <div class="row">
      <button class="primary" id="start">开始练习</button>
      <button id="resume" class="hidden"></button>
    </div>
    <div class="note">打完一句会自动跳到下一句；全角/半角、英文大小写不算错。文章只保存在你自己的浏览器里。<br>
      按键提示第一次使用时需要下载约 18MB 的读音词典，之后浏览器会缓存。汉字读音由词典自动判断，偶尔会不准。</div>
  </section>

  <!-- practice -->
  <section id="practice" class="card hidden">
    <div class="stats">
      <div class="stat"><b id="sProg">0/0</b><span>进度</span></div>
      <div class="stat"><b id="sSpeed">0</b><span>字/分钟</span></div>
      <div class="stat"><b id="sAcc">100%</b><span>正确率</span></div>
      <div class="stat"><b id="sTime">0:00</b><span>用时</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="target" id="target"></div>
    <div class="next" id="next"></div>
    <div class="hint hidden" id="hintBox"></div>
    <textarea id="inp" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="在这里打字…"></textarea>
    <div class="msg" id="msg"></div>
    <div class="row space">
      <div class="row" style="margin:0">
        <button id="prev">上一句</button>
        <button id="redo">重打</button>
        <button id="skip">跳过</button>
        <button id="hintBtn">提示</button>
      </div>
      <button class="ghost" id="back">换文章 / 设置</button>
    </div>
  </section>

  <!-- result -->
  <section id="result" class="card hidden">
    <div style="color:var(--muted);font-size:14px">全部打完了 🎉</div>
    <div class="big" id="rSpeed">0 字/分钟</div>
    <div class="res">
      <div class="stat"><b id="rChars">0</b><span>打了多少字</span></div>
      <div class="stat"><b id="rAcc">0%</b><span>正确率</span></div>
      <div class="stat"><b id="rTime">0:00</b><span>用时</span></div>
    </div>
    <div class="row">
      <button class="primary" id="drill">只重练打错的句子</button>
      <button id="again">同一篇再来一次</button>
      <button id="newtext">换一篇文章</button>
    </div>
  </section>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const KEY = 'jp-typing-practice-v1';
const SAMPLE = `毎朝、駅まで歩く途中に小さなパン屋があります。店の前を通ると、焼きたてのパンのいい香りがして、つい足を止めてしまいます。
今日は思い切って中に入り、メロンパンを一つ買いました。外はさくさく、中はふわふわで、とてもおいしかったです。
店員さんに「また来てくださいね」と言われて、少しうれしくなりました。明日は別のパンも試してみようと思います。`;
// ー (long vowel) is deliberately NOT treated as punctuation
const PUNCT = /[、。，．,.・「」『』【】〔〕［］\[\]（）()！？!?：:；;…‥―—"'“”‘’《》〈〉]/g;

let S = {text:'', mode:'sentence', nopunct:false, nospace:true, reps:1, idx:0, ime:'romaji', hint:false, kbd:'us'};
let segs = [], tgt = [], tgtN = [];
let errSet = new Set(), segErr = 0, rep = 1;
let log = [];               // {chars, errs} per finished attempt
let finished = new Set();   // segment indexes fully done
let wrong = new Set();      // segment texts with any mistake
let activeMs = 0, lastT = 0;
let composing = false, preLen = 0, advancing = false, tick = null;
let lastJudge = 0, lastVN = [];

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S = Object.assign(S, s); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* =========================================================
   Kana / key tables
   ========================================================= */
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const isKanji = c => /[㐀-䶿一-鿿豈-﫿々〆ヶ]/.test(c);
const hasKanji = s => [...s].some(isKanji);
const isKanaStr = s => /^[ぁ-ゖ゛-ゟー]+$/.test(s);

const R1 = {};
(function(){
  const rows = {
    a:'あいうえお', k:'かきくけこ', s:'さしすせそ', t:'たちつてと', n:'なにぬねの', h:'はひふへほ',
    m:'まみむめも', r:'らりるれろ', g:'がぎぐげご', z:'ざじずぜぞ', d:'だぢづでど', b:'ばびぶべぼ', p:'ぱぴぷぺぽ'
  };
  const v = ['a','i','u','e','o'];
  for(const [c,row] of Object.entries(rows)) [...row].forEach((k,i)=>{ R1[k] = (c==='a'?'':c) + v[i]; });
  Object.assign(R1, {し:'shi',ち:'chi',つ:'tsu',ふ:'fu',じ:'ji',ぢ:'di',づ:'du',
    や:'ya',ゆ:'yu',よ:'yo',わ:'wa',を:'wo',ん:'nn',ゔ:'vu',
    ぁ:'la',ぃ:'li',ぅ:'lu',ぇ:'le',ぉ:'lo',ゃ:'lya',ゅ:'lyu',ょ:'lyo',ゎ:'lwa',ゕ:'lka',ゖ:'lke',
    'ー':'-','、':',','。':'.','・':'/','「':'[','」':']','〜':'~','～':'~','！':'!','？':'?','（':'(','）':')','：':':','；':';','　':' '});
})();
const YOON = {'しゃ':'sha','しゅ':'shu','しぇ':'she','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちぇ':'che','ちょ':'cho',
  'じゃ':'ja','じゅ':'ju','じぇ':'je','じょ':'jo','ぢゃ':'dya','ぢゅ':'dyu','ぢょ':'dyo',
  'ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','てぃ':'thi','でぃ':'dhi','でゅ':'dhu','とぅ':'twu','どぅ':'dwu',
  'うぃ':'wi','うぇ':'we','うぉ':'who','ゔぁ':'va','ゔぃ':'vi','ゔぇ':'ve','ゔぉ':'vo',
  'つぁ':'tsa','つぃ':'tsi','つぇ':'tse','つぉ':'tso','いぇ':'ye','きぇ':'kye','ぎぇ':'gye'};

/* flick: key + direction (+ 小゛゜ presses) */
const FLICK = {};
(function(){
  const D = ['','←','↑','→','↓'];
  const keys = {あ:'あいうえお',か:'かきくけこ',さ:'さしすせそ',た:'たちつてと',な:'なにぬねの',は:'はひふへほ',
    ま:'まみむめも',や:'や「ゆ」よ',ら:'らりるれろ',わ:'わをんー','、':'、。？！'};
  for(const [k,row] of Object.entries(keys)) [...row].forEach((c,i)=>{ if(!(c in FLICK)) FLICK[c] = {key:k, dir:D[i], mod:0}; });
  const add = (pairs, mod) => pairs.split(' ').forEach(p => { const [b,c] = [...p]; FLICK[c] = Object.assign({}, FLICK[b], {mod}); });
  add('かが きぎ くぐ けげ こご さざ しじ すず せぜ そぞ ただ ちぢ てで とど はば ひび ふぶ へべ ほぼ', 1);
  add('はぱ ひぴ ふぷ へぺ ほぽ つづ うゔ', 2);
  add('あぁ いぃ うぅ えぇ おぉ やゃ ゆゅ よょ わゎ つっ', 1);
  FLICK['?'] = FLICK['？']; FLICK['!'] = FLICK['！'];
})();
function flickStr(c){
  const f = FLICK[c];
  if(!f) return /[ -~]/.test(c) ? c : '?';
  let s = f.key + (f.dir || '');
  if(f.mod) s += '+小' + (f.mod > 1 ? '×' + f.mod : '');
  return s;
}

/* JIS kana input */
const JIS = {};
(function(){
  const plain = {ぬ:'1',ふ:'2',あ:'3',う:'4',え:'5',お:'6',や:'7',ゆ:'8',よ:'9',わ:'0',ほ:'-',へ:'^',ー:'¥',
    た:'Q',て:'W',い:'E',す:'R',か:'T',ん:'Y',な:'U',に:'I',ら:'O',せ:'P',
    ち:'A',と:'S',し:'D',は:'F',き:'G',く:'H',ま:'J',の:'K',り:'L',れ:';',け:':',む:']',
    つ:'Z',さ:'X',そ:'C',ひ:'V',こ:'B',み:'N',も:'M',ね:',',る:'.',め:'/',ろ:'\\'};
  const shift = {ぁ:'3',ぃ:'E',ぅ:'4',ぇ:'5',ぉ:'6',ゃ:'7',ゅ:'8',ょ:'9',を:'0',っ:'Z','、':',','。':'.','・':'/','「':'[','」':']'};
  for(const [c,k] of Object.entries(plain)) JIS[c] = k;
  for(const [c,k] of Object.entries(shift)) JIS[c] = '⇧' + k;
  const dk = 'かが きぎ くぐ けげ こご さざ しじ すず せぜ そぞ ただ ちぢ つづ てで とど はば ひび ふぶ へべ ほぼ うゔ';
  dk.split(' ').forEach(p => { const [b,c] = [...p]; JIS[c] = JIS[b] + '+@'; });
  'はぱ ひぴ ふぷ へぺ ほぽ'.split(' ').forEach(p => { const [b,c] = [...p]; JIS[c] = JIS[b] + '+['; });
})();
function jisStr(c){ return JIS[c] || (/[ -~]/.test(c) ? c : '?'); }

/* reading (hiragana) -> typing units */
function toUnits(h){
  const cs = [...h], out = [];
  for(let i=0;i<cs.length;i++){
    const c = cs[i], n = cs[i+1];
    if(n && 'ゃゅょぁぃぅぇぉ'.includes(n)){
      let r = YOON[c+n];
      if(!r && 'ゃゅょ'.includes(n)){
        const b = R1[c];
        if(b && b.length >= 2 && b.endsWith('i')) r = b.slice(0,-1) + 'y' + {ゃ:'a',ゅ:'u',ょ:'o'}[n];
      }
      if(r){ out.push({k:c+n, r}); i++; continue; }
    }
    let r = R1[c];
    if(r == null) r = /[ -~]/.test(c) ? c.toLowerCase() : null;
    out.push({k:c, r});
  }
  for(let i=0;i<out.length;i++) if(out[i].k === 'っ'){
    const nx = out[i+1];

}

/* =========================================================

   ========================================================= */
let tokenizer = null, tokState = 'idle';   // idle | loading | ready | error
const tokCache = new Map();
function ensureTokenizer(){
  if(tokState !== 'idle') return;
  tokState = 'loading'; refreshHint();
  const sc = document.createElement('script');
  sc.src = 'lib/kuromoji.js';
  sc.onload = () => {
    try{
      kuromoji.builder({dicPath:'dict/'}).build((err, t) => {
        if(err){ tokState = 'error'; console.error(err); }
        else { tokenizer = t; tokState = 'ready'; }
        tokCache.clear(); refreshAll();
      });
    }catch(e){ tokState = 'error'; console.error(e); refreshAll(); }
  };
  sc.onerror = () => { tokState = 'error'; refreshAll(); };

function mkTok(surface, start, end, rd){
  const sh = kata2hira(surface);
  if(!hasKanji(surface) && isKanaStr(sh)) rd = sh;
  else if(rd) rd = kata2hira(rd);
  if(!rd){
    if(/^[\x20-\x7e]+$/.test(surface.normalize('NFKC'))) rd = surface.normalize('NFKC');
    else if([...sh].every(c => R1[c] != null)) rd = sh;
  }
  const t = {surface, start, end, reading: rd || null, units: rd ? toUnits(rd) : null,
    kanji: hasKanji(surface), kata: /[ァ-ヺ]/.test(surface) && !hasKanji(surface), ruby: null};
  if(t.kanji && rd){
    const s = [...surface], r = [...rd];
    let a = 0; while(a < s.length-1 && a < r.length && !isKanji(s[a]) && kata2hira(s[a]) === r[a]) a++;
    let b = 0; while(b < s.length-a-1 && b < r.length-a && !isKanji(s[s.length-1-b]) && kata2hira(s[s.length-1-b]) === r[r.length-1-b]) b++;
    t.ruby = {start: start+a, end: end-b, rt: r.slice(a, r.length-b).join('')};
  }
  t.kanaLen = t.units ? t.units.reduce((n,u)=>n+[...u.k].length, 0) : 0;

}
function tokInfo(seg){
  if(tokCache.has(seg)) return tokCache.get(seg);
  let toks = [];
  if(tokenizer){
    let pos = 0;
    for(const t of tokenizer.tokenize(seg)){
      const n = [...t.surface_form].length;
      toks.push(mkTok(t.surface_form, pos, pos+n, t.reading && t.reading !== '*' ? t.reading : null));
      pos += n;
    }
  } else {
    toks = [...seg].map((c,i) => mkTok(c, i, i+1, null));
  }
  if(tokenizer) tokCache.set(seg, toks);
  return toks;
}

/* =========================================================
   Text processing
   ========================================================= */
function normc(c){
  let n = c.normalize('NFKC').toLowerCase();
  if(n === '〜' || n === '～') n = '~';
  if(n === '−' || n === '‐') n = '-';
  return n;
}
function chunk(s, max){
  if([...s].length <= max) return [s];
  const pieces = s.match(/[^、，,]+[、，,]*/g) || [s];
  const out = []; let cur = '';
  for(const p of pieces){
    if([...cur].length + [...p].length > max && cur){ out.push(cur); cur = ''; }
    cur += p;
    while([...cur].length > max*1.4){ const a=[...cur]; out.push(a.slice(0,max).join('')); cur = a.slice(max).join(''); }
  }
  if(cur) out.push(cur);
  return out;
}
function segment(text, mode){
  const lines = text.replace(/\r\n?/g,'\n').split('\n')
    .map(s => s.replace(/[ \t　]+/g,' ').trim()).filter(Boolean);
  const out = [];
  if(mode === 'line'){ for(const l of lines) out.push(...chunk(l, 90)); }
  else{
    for(const l of lines){
      const parts = l.match(/[^。！？!?]*[。！？!?]+[」』）)】]*|[^。！？!?]+$/g) || [l];
      for(let p of parts){ p = p.trim(); if(p) out.push(...chunk(p, 60)); }
    }
  }
  return out;
}
function clean(s){
  s = s.replace(/\n/g,'');
  if(S.nopunct) s = s.replace(PUNCT,'');
  if(S.nospace) s = s.replace(/[ 　]/g,'');
  return s;
}

  const pend = S.ime === 'romaji' && m ? m[0] : '';
  const ca = [...kata2hira(pend ? cn.slice(0, -pend.length) : cn)];
  let R = []; for(let q=i; q<toks.length && toks[q].units; q++) for(const u of toks[q].units) R.push(...u.k);
  let j = 0; while(j < ca.length && j < R.length && ca[j] === R[j]) j++;
  const modPending = S.ime !== 'romaji' && j === ca.length-1 && R[j] && isModOf(ca[j], R[j]) &&
    (S.ime === 'flick' || (JIS[R[j]]||'').includes('+'));

  let k = j;
  while(i < toks.length-1 && toks[i].units && toks[i].kanaLen > 0 && (k > toks[i].kanaLen || (k === toks[i].kanaLen && (pend || modPending)))){ k -= toks[i].kanaLen; i++; }
  const t = toks[i];

  let html = '';
  const err = tokState === 'error' ? '<div class="conv">读音词典没加载成功，汉字的读音暂时没法提示。</div>' : '';
  if(!t.units){
    html = `<div class="head"><span class="word">${esc(t.surface)}</span><span class="read">这个词没有读音数据</span></div>`;
    act = null;
  } else {
    const showRead = t.reading && t.reading !== t.surface;
    html = `<div class="head"><span class="word">${esc(t.surface)}</span>` +
      (showRead ? `<span class="read">${esc(t.reading)}</span>` : '') +
      (convNote(t) ? `<span class="conv">${esc(convNote(t))}</span>` : '') + '</div><div class="units">';
    let cum = 0, cur = null, curOff = 0;
    for(const u of t.units){
      const len = [...u.k].length;
      let cls = '';
      let keys = esc(unitKeys(u));
      if(cum + len <= k) cls = 'done';
      else if(!cur){
        cls = 'cur'; cur = u; curOff = k - cum;
        if(S.ime === 'romaji' && pend && u.r && u.r.startsWith(pend)) keys = `<u>${esc(pend)}</u>${esc(u.r.slice(pend.length))}`;
      }
      cum += len;
      html += `<span class="u ${cls}"><i>${esc(u.k)}</i><b>${keys}</b></span>`;
    }
    html += '</div>';

    if(modPending){
      const want = R[j], typed = ca[j];
      if(S.ime === 'flick'){
        const times = Math.max(1, (FLICK[want].mod||0) - ((FLICK[typed]||{}).mod||0));
        act = {type:'mod', c:want, times};
      } else act = {type:'mod', c:want, key: JIS[want].endsWith('@') ? '@' : '['};
    } else if(cur){
      const c = [...cur.k][curOff] || [...cur.k][0];
      if(S.ime === 'romaji'){
        const r = cur.r || '';
        const ch = (pend && r.startsWith(pend)) ? r[pend.length] : r[0];
        act = ch ? {type:'key', ch, for:cur.k} : null;
      } else act = firstAct(c, cur);
    } else {
      // whole word typed
      if(t.kanji || t.kata) act = {type:'space', word:t.surface};
      else {
        const nt = toks[i+1];
        if(nt && nt.units && nt.units[0]) act = firstAct([...nt.units[0].k][0], nt.units[0]);
        else act = {type:'enter'};
      }
    }
  }
  const v = nextKeyView(act);
  if(v.label) html += `<div class="nk">下一步：${v.label}</div>`;
  html += v.board;
  const nt = toks[i+1];
  if(nt) html += `<div class="after">接着：${esc(nt.surface)}${nt.reading && nt.reading !== nt.surface ? '（' + esc(nt.reading) + '）' : ''}` +
    (nt.units ? ` → <b>${esc(nt.units.map(unitKeys).join(S.ime === 'romaji' ? '' : ' · '))}</b>` : '') + '</div>';
  html += `<div class="legend">${esc(legend())}</div>`;
  box.innerHTML = err + html;
}
function refreshHint(){ if(!$('practice').classList.contains('hidden') && segs.length) renderHint(lastBase, lastComp); }
function refreshAll(){
  if($('practice').classList.contains('hidden') || !segs.length) return;
  render(lastJudge, lastVN); renderHint(lastBase, lastComp);
}
function updHintBtn(){ const b = $('hintBtn'); b.textContent = S.hint ? '提示：开' : '提示：关'; b.classList.toggle('on', S.hint); }
$('hintBtn').onclick = () => {
  S.hint = !S.hint; $('hint').checked = S.hint; save(); updHintBtn();
  if(S.hint) ensureTokenizer();
  refreshAll(); $('inp').focus();
};

function stamp(){
  const now = performance.now();
  if(lastT) activeMs += Math.min(now - lastT, 5000);   // pauses longer than 5s don't count
  lastT = now;
}
function handle(commit){
  if(advancing) return;
  const v = [...clean($('inp').value)];
  const vN = v.map(normc);
  if(!commit){
    const base = Math.min(preLen, tgt.length);
    render(base, vN);
    renderHint(base, v.slice(preLen).join(''));
    return;
  }
  for(let i=0;i<Math.min(vN.length,tgt.length);i++){
    if(vN[i] !== tgtN[i] && !errSet.has(i)){ errSet.add(i); segErr++; }
  }
  const base = Math.min(vN.length, tgt.length);
  render(base, vN);
  renderHint(base, '');
  const extra = vN.length - tgt.length;
  if(extra > 0) setMsg(`多打了 ${extra} 个字`, true);
  else setMsg(S.reps > 1 ? `第 ${rep} / ${S.reps} 遍` : '');
  if(vN.length === tgt.length && vN.every((c,i)=>c===tgtN[i])) complete();
}
function complete(){
  advancing = true;
  log.push({chars: tgt.length, errs: segErr});
  if(segErr > 0) wrong.add(segs[S.idx]);
  $('target').classList.remove('flash'); void $('target').offsetWidth; $('target').classList.add('flash');
  setTimeout(() => {
    if(rep < S.reps){ rep++; loadSeg(); return; }
    finished.add(S.idx);
    rep = 1;
    if(S.idx >= segs.length-1){ finish(); return; }
    S.idx++; loadSeg();
  }, 160);
}
function totals(){
  let chars=0, errs=0;
  for(const d of log){ chars+=d.chars; errs+=d.errs; }
  return {chars, errs};
}
function fmt(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function acc(t){ return t.chars ? Math.max(0, Math.round((t.chars - t.errs)/t.chars*100)) + '%' : '–'; }
function updStats(){
  const t = totals(), min = activeMs/60000;
  $('sProg').textContent = `${finished.size}/${segs.length}`;
  $('bar').style.width = (segs.length ? finished.size/segs.length*100 : 0) + '%';
  $('sSpeed').textContent = (min > 0.05 && t.chars) ? Math.round(t.chars/min) : '–';
  $('sAcc').textContent = acc(t);
  $('sTime').textContent = fmt(activeMs);
}
function finish(){
  clearInterval(tick);
  const t = totals(), min = activeMs/60000;
  $('rSpeed').textContent = (min>0 && t.chars ? Math.round(t.chars/min) : 0) + ' 字/分钟';
  $('rChars').textContent = t.chars;
  $('rAcc').textContent = acc(t);
  $('rTime').textContent = fmt(activeMs);
  const d = $('drill');
  d.textContent = wrong.size ? `只重练打错的 ${wrong.size} 句` : '没有打错的句子 👍';
  d.disabled = !wrong.size;
  d.classList.toggle('primary', !!wrong.size);
  $('again').classList.toggle('primary', !wrong.size);
  S.idx = 0; save();
  show('result');
}

const inp = $('inp');
inp.addEventListener('compositionstart', () => { composing = true; preLen = [...clean(inp.value)].length; });
inp.addEventListener('compositionupdate', () => { setTimeout(()=>{ if(composing) handle(false); }, 0); });
inp.addEventListener('compositionend', () => { composing = false; setTimeout(()=>handle(true), 0); });
inp.addEventListener('input', e => {
  stamp();
  if(composing || e.isComposing) handle(false); else handle(true);
});
inp.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); if(!composing) handle(true); }
});
$('prev').onclick = () => { if(S.idx>0){ S.idx--; rep = 1; loadSeg(); } };
$('redo').onclick = () => { loadSeg(); };
$('skip').onclick = () => { rep = 1; if(S.idx >= segs.length-1) finish(); else { S.idx++; loadSeg(); } };
$('back').onclick = () => { clearInterval(tick); show('setup'); refreshResume(); };
$('again').onclick = () => begin(0);
$('drill').onclick = () => { if(wrong.size) begin(0, [...wrong]); };
$('newtext').onclick = () => { S.idx=0; save(); show('setup'); refreshResume(); $('src').select(); };

function refreshResume(){
  const b = $('resume');
  if(S.text && S.idx > 0 && $('src').value === S.text){
    b.textContent = `从上次的第 ${S.idx+1} 句继续`; b.classList.remove('hidden');
  } else b.classList.add('hidden');
}
$('src').addEventListener('input', refreshResume);

/* init */
load();
$('src').value = S.text || '';
$('mode').value = S.mode; $('nopunct').checked = S.nopunct; $('nospace').checked = S.nospace;
$('reps').value = String(S.reps||1);
$('ime').value = S.ime || 'romaji'; $('hint').checked = !!S.hint; $('kbd').value = S.kbd || 'us'; kbdVis();
updateCount(); refreshResume();
})();
</script>
</body>
